# Console HUD (terminal safety readout, hud/). A VIEW only — never affects the
# safety loop. Read at start-up (ground rule 5).
#
# refresh_hz  How often the HUD line is redrawn (a few Hz suffices; the safety
#             loop runs at 20 Hz regardless).
# use_colour  Colour the zone word with ANSI codes, or plain text (still legible
#             — GREEN/YELLOW/RED/LOST are self-describing) for colour-averse terms.
# colours     Zone -> ANSI SGR code (ints, not raw escapes). build_colour_map
#             turns these into escape sequences.

hud:
  refresh_hz: 5.0
  use_colour: true
  colours:
    green: 32   # green
    yellow: 33  # yellow
    red: 31     # red
    lost: 90    # grey (bright black) — signals perception failure
