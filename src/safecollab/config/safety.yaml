# Safety monitor configuration (Stream F). Read at start-up and passed to
# SafetyMonitorLogic; nothing safety-related is hard-coded (ground rule 5).
#
# s_min        Minimum speed scale in the yellow band — the "floor" of the
#              ISO/TS 15066 ramp. In (0, 1); 0.10 = 10 % of full speed.
# loss_timeout Seconds of absent/stale human TF before the "lost" fail-safe
#              (FR-9 / AT-5): the wrapper passes d=None to classify() → a
#              protective stop, never reusing the last known position. 0.5 s =
#              five missed 10 Hz detection cycles, yet under a half-second of
#              free running.
# robot_frames TF frames (UR5e robot_state_publisher) for the min-distance
#              sweep. tool0/wrist_3_link are highest-risk; forearm_link backstops
#              the swinging elbow. The monitor takes the MINIMUM over all frames.

safety:
  s_min: 0.10          # minimum speed scale in the yellow band (10 % of full speed)
  loss_timeout: 0.5    # seconds before a stale/missing human TF triggers the fail-safe
  robot_frames:        # UR5e TF frames swept for min-distance (AGENTS.md §3)
    - tool0            # the tool centre point (end of the wrist) — highest risk
    - wrist_3_link     # final wrist link
    - forearm_link     # elbow/forearm — nearest arm body to a reaching operator
  marker_radius: 0.15        # radius (m) of the RViz safety-zone sphere at the human position
  marker_label_offset: 0.25  # gap (m) between the sphere top and the floating zone text label
  marker_label_height: 0.20  # RViz TEXT_VIEW_FACING glyph height (m) for the zone label
  # safety_source (§11 fallback #4): which human TF the loop reads.
  #   "perceived"    (default) — world → human from perception_node (headline demo).
  #   "ground_truth"           — world → human_gt from human_node; use when
  #                              perception is flaky/absent. Override via launch arg:
  #                              ros2 launch safecollab cell.launch.py safety_source:=ground_truth
  safety_source: perceived
