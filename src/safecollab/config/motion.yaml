# motion_node tuning (Stream D). Loaded via load_motion_config(); ground rule 5
# keeps these knobs here, not as code literals.

motion:
  # Dead-band on /safety/scale before re-issuing the arm command. safety_monitor
  # publishes /safety/scale at 20 Hz even when unchanged; without a dead-band
  # motion_node would re-publish the same leg ~20x/s, and the
  # joint_trajectory_controller resets its time origin on every message so it
  # never finishes a leg (the arm jitters, re-aiming at the leg start). Only
  # re-issue when the scale moves by at least this much; stop/resume edges are
  # always honoured regardless.
  republish_scale_epsilon: 0.02

  # Protective-stop hold horizon (s). On scale == 0, command the CURRENT joint
  # position over this short time so the controller actively holds:
  # joint_trajectory_controller drives an active trajectory to completion when
  # commands go silent, so "hold by inaction" would let the arm coast to the leg
  # end. A small positive horizon stops immediately without a zero-duration goal.
  hold_time_s: 0.2
