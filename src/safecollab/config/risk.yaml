# Inputs to the ISO/TS 15066 protective-separation model. Thresholds are
# COMPUTED from these at start-up (safecollab/safety/risk.py); never paste the
# resulting d_red / d_yellow back into code (ground rule 5).
#
#   S_p = v_h*(t_r+t_s) + v_r*t_r + s_s + c + z_d + z_r
#
# Both scenarios share the cell/sensor properties (v_h, t_r, s_s, c, z_r); each
# has its own v_r AND t_s (a slower robot stops faster, so t_s shrinks with v_r).
# z_d (operator uncertainty) is supplied live by perception, not stored here.
#
# Worked example (test_risk.py) with z_d = 0.05:
#   d_yellow = 1.6*(0.10+0.25) + 0.50*0.10 + 0.06 + 0.10 + 0.05 + 0.02 = 0.84 m
#   d_red    = 1.6*(0.10+0.02) + 0.10*0.10 + 0.06 + 0.10 + 0.05 + 0.02 = 0.43 m
risk:
  # Shared across both scenarios:
  v_h: 1.6      # operator approach speed (m/s)
  t_r: 0.10     # system reaction time (s)
  s_s: 0.06     # robot stopping-distance contribution (m)
  c: 0.10       # intrusion distance (m)
  z_r: 0.02     # robot position uncertainty (m)
  full_speed:
    v_r: 0.50   # robot TCP speed at full speed (m/s)
    t_s: 0.25   # robot stop time at full speed (s)
  reduced:
    v_r: 0.10   # robot TCP speed once in the yellow band (m/s)
    t_s: 0.02   # robot stop time at reduced speed (s) — shrinks with speed
