# Inputs to the ISO/TS 15066 protective-separation model (S_p).
# Thresholds are COMPUTED from these at start-up (safecollab/risk.py); never
# paste the resulting d_red / d_yellow back into code (AGENTS.md ground rule 5).
#
#   S_p = S_H + S_R + S_S + C + Z_d + Z_r
#       = v_h*(t_r+t_s) + v_r*t_r + s_s + c + z_d + z_r
#
# z_d (operator position uncertainty) is supplied live by perception, so it is
# NOT stored here. The two zone thresholds use two operating scenarios:
#   * full_speed -> d_yellow, robot at nominal v_r
#   * reduced    -> d_red,    robot at v_r * yellow_frac (slowed approach)
#
# Worked example (test_risk.py target): with z_d = 0.05
#   d_yellow = 1.6*(0.10+0.25) + 0.50*0.10 + 0.07 + 0.10 + 0.05 + 0.02 = 0.85 m
#   d_red    = 0.5*(0.10+0.10) + 0.10*0.10 + 0.07 + 0.10 + 0.05 + 0.02 = 0.35 m
risk:
  v_r: 0.50          # robot TCP nominal speed (m/s)
  yellow_frac: 0.2   # fraction of v_r used for the reduced-speed (red) scenario

  full_speed:        # nominal operating point -> yields d_yellow
    v_h: 1.6         # operator approach speed (m/s)
    t_r: 0.10        # system reaction time (s)
    t_s: 0.25        # robot stop time (s)
    s_s: 0.07        # robot stopping distance (m)
    c:   0.10        # intrusion distance (m)
    z_r: 0.02        # robot position uncertainty (m)

  reduced:           # slowed approach near contact -> yields d_red
    v_h: 0.5         # operator approach speed at close range (m/s)
    t_r: 0.10        # system reaction time (s)
    t_s: 0.10        # robot stop time when already slowed (s)
    s_s: 0.07        # robot stopping distance (m)
    c:   0.10        # intrusion distance (m)
    z_r: 0.02        # robot position uncertainty (m)
